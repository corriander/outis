name: ci / docker publish

# Build the Outis image and publish to GHCR. Four lanes, one build pipeline:
#
#   workflow_call      -> :X.Y.Z, :latest             (immutable release + newest release)
#   push to main       -> :main, :main-<sha>          (rolling tip of main + immutable pin)
#   push to dev        -> :dev, :dev-<sha>            (rolling dev + immutable pin)
#   workflow_dispatch  -> :preview-<branch>-<sha>     (immutable ad-hoc preview)
#
# `:latest` means the newest release, not the tip of main. Deployments that want
# merged-but-unreleased code ask for `:main` explicitly.
#
# Why the release lane is `workflow_call` and not `on: push: tags:`
# ----------------------------------------------------------------
# The release automation creates its tag and GitHub release with the default
# GITHUB_TOKEN. Events raised by GITHUB_TOKEN do not start further workflow
# runs — GitHub's recursion guard — so a `push: tags:` or `release: published`
# trigger here would simply never fire. `release.yml` therefore calls this
# workflow directly once release-please reports a release, which keeps the
# whole flow on GITHUB_TOKEN with no personal access token anywhere.
#
# Preview lane
# ------------
# Run this workflow manually (Actions -> "ci / docker publish" -> Run workflow)
# on any branch to publish `:preview-<sanitized-branch>-<shortsha>`. The tag is
# immutable, human-findable, and cannot collide with a release tag because
# release tags are bare semver and previews always carry the `preview-` prefix.
#
# Multi-arch (linux/amd64 + linux/arm64): each arch builds on its own native
# runner and pushes by digest, then a merge job stitches the digests into one
# manifest list and applies the tags (faster + cleaner than QEMU emulation).
# Registry: ghcr.io/<owner>/<repo>.

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to build and publish.
        required: true
        type: string
      version:
        description: Semver to publish as the immutable image tag (no leading v).
        required: true
        type: string

# `inputs.version` is empty for push and workflow_dispatch, so a release run
# never shares a concurrency group with the push-to-main run for the same
# commit and the two cannot cancel each other. They can therefore overlap, which
# is safe: the two lanes write disjoint tag sets (`latest` + semver against
# `main` + `main-<sha>`), so neither can clobber the other's tags.
concurrency:
  group: docker-publish-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest + tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Resolve publish lane
        id: ctx
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${BUILD_SHA:0:7}"

          # Placeholders keep every `type=raw,value=` non-empty; the matching
          # `enable=` expression decides what is actually published.
          version="0.0.0"
          preview="preview-unused-0000000"

          if [ -n "${INPUT_VERSION}" ]; then
            mode="release"
            version="${INPUT_VERSION#v}"
            primary="${version}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="preview"
            slug=$(printf '%s' "${REF_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
              | cut -c1-40)
            [ -n "${slug}" ] || slug="ref"
            preview="preview-${slug}-${short}"
            primary="${preview}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            mode="main"
            primary="main"
          elif [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            mode="dev"
            primary="dev"
          else
            echo "::error::No publish lane for event=${EVENT_NAME} ref=${GITHUB_REF}"
            exit 1
          fi

          {
            echo "mode=${mode}"
            echo "version=${version}"
            echo "preview=${preview}"
            echo "short=${short}"
            echo "primary=${primary}"
          } >> "$GITHUB_OUTPUT"
          echo "lane=\`${mode}\` primary tag=\`${primary}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.ctx.outputs.mode == 'release' }}
            type=raw,value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.mode == 'release' }}
            type=raw,value=main,enable=${{ steps.ctx.outputs.mode == 'main' }}
            type=raw,value=main-${{ steps.ctx.outputs.short }},enable=${{ steps.ctx.outputs.mode == 'main' }}
            type=raw,value=dev,enable=${{ steps.ctx.outputs.mode == 'dev' }}
            type=raw,value=dev-${{ steps.ctx.outputs.short }},enable=${{ steps.ctx.outputs.mode == 'dev' }}
            type=raw,value=${{ steps.ctx.outputs.preview }},enable=${{ steps.ctx.outputs.mode == 'preview' }}
      - name: Create manifest list + push tags
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ -n "$tags" ] || { echo "::error::No tags were computed for this lane"; exit 1; }
          digests=$(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          # word-splitting is intended: $tags and $digests each expand to multiple args
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
      - name: Inspect
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${PRIMARY_TAG}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PRIMARY_TAG: ${{ steps.ctx.outputs.primary }}
